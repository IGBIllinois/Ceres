
// We are using Protobuf syntax version three.

syntax = "proto3";

// A Timestamp represents a point in time independent of any time zone or local
// calendar, encoded as a count of seconds and fractions of seconds at
// nanosecond resolution. The count is relative to an epoch at UTC midnight on
// January 1, 1970, in the proleptic Gregorian calendar which extends the
// Gregorian calendar backwards to year one.
//
//import "google/protobuf/timestamp.proto";


/******************************************************************************
 * Property Page <-> Sensor Controller
 *****************************************************************************/

enum eQuery 
{
  eQUERY_UNSPECIFIED = 0;
  eQUERY_STATE = 1;
  eQUERY_ACTIVE_CAMERA_ID = 2;
  eQUERY_IMAGE_SIZE = 3;
  eQUERY_FRAME_RATE = 4;
}

message QueryMessage_1 
{
	eQuery query = 1;
}

message ActiveCameraIdMessage_1
{
    uint32 camera_id = 1;
}

message ImageSizeMessage_1 
{
	uint32 width = 1;
	uint32 height = 2;
}

message FrameRateMessage_1 
{
	uint32 frames_per_second = 1;
}

 message StateMessage_1 
{
	bool   valid = 1;
	uint32 camera_id = 2;
	uint32 width = 3;
	uint32 height = 4;
    uint32 frames_per_second = 5;
}

