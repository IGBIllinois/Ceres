
// We are using Protobuf syntax version three.

syntax = "proto3";

// Google protobuf does not support namespaces.  To avoid linker name conficts 
// all messages must start with "namespace" name


/******************************************************************************
 * Property Page <-> Sensor Controller
 *****************************************************************************/

enum axis_eQuery 
{
  eQUERY_UNSPECIFIED = 0;
  eQUERY_STATE = 1;
  eQUERY_ACTIVE_CAMERA_ID = 2;
  eQUERY_IMAGE_SIZE = 3;
  eQUERY_FRAME_RATE = 4;
}

message axis_QueryMessage_1 
{
	axis_eQuery query = 1;
}

message axis_ActiveCameraIdMessage_1
{
    uint32 camera_id = 1;
}

message axis_ImageSizeMessage_1 
{
	uint32 width = 1;
	uint32 height = 2;
}

message axis_FrameRateMessage_1 
{
	uint32 frames_per_second = 1;
}

 message axis_StateMessage_1 
{
	bool   valid = 1;
	uint32 camera_id = 2;
	uint32 width = 3;
	uint32 height = 4;
    uint32 frames_per_second = 5;
}

